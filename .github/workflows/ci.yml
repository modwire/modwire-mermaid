name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv lock --check
      - run: uv sync --locked --group dev
      - run: make quality

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv lock --check
      - run: uv sync --locked --group dev
      - run: make pytest

  compatibility:
    name: Mermaid compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: uv lock --check
      - run: uv sync --locked --group dev
      - run: make compat
      - run: make diagrams-validate
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv lock --check
      - run: uv sync --locked --group dev
      - run: make package-check

  ci:
    name: ci
    if: always()
    needs: [quality, pytest, compatibility, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job
        env:
          QUALITY: ${{ needs.quality.result }}
          PYTEST: ${{ needs.pytest.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          test "$QUALITY" = success
          test "$PYTEST" = success
          test "$COMPATIBILITY" = success
          test "$PACKAGE" = success
