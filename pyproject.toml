[build-system]
requires = ["hatchling>=1.28", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[project]
name = "mermaiden"
dynamic = ["version"]
description = "Typed deterministic Mermaid source generation for Python."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "9orky" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

dependencies = [
    "jinja2>=3.1",
    "jsonschema>=4.25",
    "pydantic>=2.12",
    "pyyaml>=6",
    "wireup>=2.12.0",
]

[project.optional-dependencies]
dev = ["build>=1.3", "import-linter>=2.11", "packaging>=25", "pyright>=1.1.403", "pytest>=9", "ruff>=0.14", "twine>=7"]

[dependency-groups]
dev = ["build>=1.3", "import-linter>=2.11", "packaging>=25", "pyright>=1.1.403", "pytest>=9", "ruff>=0.14", "twine>=7"]

[project.urls]
Repository = "https://github.com/szpak-dev/mermaiden"
Issues = "https://github.com/szpak-dev/mermaiden/issues"

[tool.hatch.version]
source = "vcs"
tag-pattern = '^v(?P<version>\d+\.\d+\.\d+)$'
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/mermaiden/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mermaiden"]

[tool.hatch.build.targets.sdist]
include = ["compatibility", "docs", "examples", "scripts", "src", "tests", ".node-version", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers", "-m", "not integration"]
cache_dir = ".dev/.pytest_cache"
filterwarnings = ["error"]
markers = ["integration: requires the lock-installed Mermaid CLI and a compatible browser"]

[tool.ruff]
cache-dir = ".dev/.ruff_cache"
line-length = 120
extend-exclude = ["**/_version.py"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
